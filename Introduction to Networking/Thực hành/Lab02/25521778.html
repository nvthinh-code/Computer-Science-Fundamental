<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"> <!-- Khắc phục lỗi font chữ tiếng Việt -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành nhập môn mạng máy tính - 2</title>
    <style>
        /* Thiết lập giao diện chung */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Căn giữa toàn bộ trang */
        }

        /* Thẻ (Card) chứa thông tin chính */
        .card {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); /* Đổ bóng nhẹ nhàng */
            padding: 40px;
            display: flex; /* Đẩy các phần tử bên trong nằm ngang */
            align-items: center;
            max-width: 650px;
            width: 90%;
            border: 1px solid #e1e4e8;
        }

        /* CSS cho Logo bên trái */
        .logo-container {
            flex-shrink: 0; /* Giữ nguyên kích thước logo không bị bóp méo */
            padding-right: 35px;
            border-right: 2px solid #e1e4e8; /* Đường kẻ dọc chia tách */
            margin-right: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            width: 140px; /* Định kích cỡ logo vừa vặn */
            height: auto;
        }

        .logo-text {
            font-size: 11px;
            font-weight: bold;
            color: #003366;
            text-align: center;
            margin-top: 8px;
            line-height: 1.3;
        }

        /* Phần chữ bên phải */
        .info {
            display: flex;
            flex-direction: column;
        }

        .info .title {
            font-size: 13px;
            font-weight: bold;
            color: #0056b3;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .info .sub-title {
            font-size: 12px;
            color: #6c757d;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .info h1 {
            font-size: 28px;
            color: #002d62; /* Xanh navy của UIT */
            margin: 0 0 8px 0;
            font-weight: 800;
        }

        .info h2 {
            font-size: 18px;
            color: #495057;
            margin: 0;
            font-weight: 500;	
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 1. PHẦN LOGO GÓC TRÁI -->
        <div class="logo-container">
            <img src="Logo_UIT_updated.svg.jpg" alt="Logo UIT" class="logo">
            <div class="logo-text">TRƯỜNG ĐẠI HỌC<br>CÔNG NGHỆ THÔNG TIN</div>
        </div>

        <!-- 2. PHẦN CHỮ BÊN PHẢI -->
        <div class="info">
            <div class="title">THỰC HÀNH NHẬP MÔN MẠNG MÁY TÍNH - LỚP 2</div>
            <div class="sub-title">LAB 2</div>
            <h1>MSSV: 25521778</h1>
            <h2>Họ và tên: Nguyễn Vũ Thịnh</h2>
        </div>
    </div>

</body>
</html>
